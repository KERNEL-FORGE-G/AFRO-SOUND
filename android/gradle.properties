# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Defini automatiquement par scripts/setup-android-sdk.sh

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

FLIPPER_VERSION=0.182.0
# Only build for the architecture of the connected device to save time
# reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
reactNativeArchitectures=arm64-v8a
newArchEnabled=false
hermesEnabled=true

reactNativeMinorVersion=72
minor=72
android.suppressUnsupportedCompileSdk=34

systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# Note: org.gradle.java.home n'est pas fixé ici afin d'utiliser le JAVA_HOME de
# l'environnement (portable entre machines et CI). Définissez JAVA_HOME (JDK 17).

# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
